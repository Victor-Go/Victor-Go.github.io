name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Require cipher epoch variables
        run: |
          test -n "$VITE_CIPHER_EPOCHS" && test -n "$VITE_CIPHER_EPOCH_CURRENT" || {
            echo "Set secret CIPHER_EPOCHS and variable CIPHER_EPOCH_CURRENT"; exit 1; }
        env:
          VITE_CIPHER_EPOCHS: ${{ secrets.CIPHER_EPOCHS }}
          VITE_CIPHER_EPOCH_CURRENT: ${{ vars.CIPHER_EPOCH_CURRENT }}

      - name: Build
        run: npm run build
        env:
          VITE_CIPHER_EPOCHS: ${{ secrets.CIPHER_EPOCHS }}
          VITE_CIPHER_EPOCH_CURRENT: ${{ vars.CIPHER_EPOCH_CURRENT }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4